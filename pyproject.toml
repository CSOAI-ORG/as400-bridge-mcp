[project]
name = "as400-bridge-mcp"
version = "0.1.0"
description = "Bridge IBM i / RPG / DB2 legacy to ONE OS — parse, map, govern (IBM i security / SOX). CSOAI Layer-0 legacy-bridge family."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "CSOAI-ORG"}]
dependencies = ["mcp>=2.0.0", "pydantic>=2.0.0"]

[project.scripts]
as400-bridge-mcp = "server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["server.py", "mcp2026_shim.py"]
